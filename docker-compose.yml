# docker-compose.yml — Desarrollo local completo
# REMEDIACIÓN: [DevEx] Setup local reproducible
#
# Uso:
#   docker-compose up -d
#   # Backend en http://localhost:8000
#   # Frontend en http://localhost:3000
#   # PostgreSQL en localhost:5432

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yachay_deep
      POSTGRES_USER: yachay
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yachay"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://yachay:localdev123@db:5432/yachay_deep
      SECRET_KEY: dev-only-secret-key-change-in-production-abc123def456
      ADMIN_EMAIL: admin@yachay.edu.ec
      ADMIN_PASSWORD: DevPassword123!
      DEBUG: "True"
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
