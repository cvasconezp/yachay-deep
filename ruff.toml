# Ruff — linter + formatter Python
# REMEDIACIÓN: [ARCH-02] Linting configurado

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "S",    # bandit (security)
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff rules
]
ignore = [
    "S101",  # assert en tests
    "S104",  # bind 0.0.0.0
    "E501",  # line length (formatter)
]

[lint.per-file-ignores]
"backend/tests/**" = ["S101", "S106"]

[format]
quote-style = "double"
indent-style = "space"
