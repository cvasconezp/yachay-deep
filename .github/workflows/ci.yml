# CI Pipeline — Yachay Deep
# REMEDIACIÓN:
#   [ARCH-01] Tests automatizados en CI
#   [ARCH-02] Linting automatizado
#   [SEC-09] Auditoría de dependencias

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linting (advisory — no bloquea deploys) ──
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/ || true
      - run: ruff format --check backend/ || true

  # ── Tests Backend con Coverage ──
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio httpx pytest-cov
      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=backend --cov-report=term-missing --cov-fail-under=60
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "True"
          ADMIN_EMAIL: "ci@test.com"
          ADMIN_PASSWORD: "CiTestPass123!"

  # ── Tests Frontend con Coverage ──
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Permitir clonar dep pública @yachaydeep/brand por HTTPS (npm ci la pide por ssh)
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: cd frontend && npm ci
      - name: Run tests with coverage
        run: cd frontend && npx vitest run --coverage

  # ── Auditoría de dependencias ──
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # [SEC-09] pip-audit — BLOQUEANTE (chore/estandar-casa punto 4).
      # Allowlist explícito de vulns aceptadas (documentadas); cualquier hallazgo
      # NUEVO fuera del allowlist hace fallar el build.
      #   PYSEC-2024-*    : heredadas, aceptadas.
      #   PYSEC-2026-1325 : ecdsa 0.19.2 — transitiva de python-jose; SIN fix upstream.
      #                     TODO: migrar python-jose -> PyJWT para eliminar ecdsa.
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-* --ignore-vuln PYSEC-2026-1325
      # [SEC-09] npm audit — BLOQUEANTE (high/critical). Excepciones documentadas
      # en frontend/.nsprc (mismo criterio que el allowlist de pip-audit):
      #   GHSA-4r6h / GHSA-5pgg : xlsx (SheetJS) — sin fix en npm; solo se EXPORTA.
      #   GHSA-fx2h-pf6j-xcff   : vite dev-server (Windows) — devDep, no va a prod;
      #                           fix = vite 8 (breaking), diferido a PR de upgrade.
      - name: Permitir clonar dep pública @yachaydeep/brand por HTTPS (npm ci la pide por ssh)
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: cd frontend && npm ci && npx --yes better-npm-audit@3 audit --level high
