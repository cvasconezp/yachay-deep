# CI Pipeline — Yachay Deep
# REMEDIACIÓN:
#   [ARCH-01] Tests automatizados en CI
#   [ARCH-02] Linting automatizado
#   [SEC-09] Auditoría de dependencias

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linting (advisory — no bloquea deploys) ──
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/ || true
      - run: ruff format --check backend/ || true

  # ── Tests Backend con Coverage ──
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio httpx pytest-cov
      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=backend --cov-report=term-missing --cov-fail-under=60
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "True"
          ADMIN_EMAIL: "ci@test.com"
          ADMIN_PASSWORD: "CiTestPass123!"

  # ── Tests Frontend con Coverage ──
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Permitir clonar dep pública @yachaydeep/brand por HTTPS (npm ci la pide por ssh)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: cd frontend && npm ci
      - name: Run tests with coverage
        run: cd frontend && npx vitest run --coverage

  # ── Auditoría de dependencias ──
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      # [SEC-09] pip-audit — BLOQUEANTE (chore/estandar-casa punto 4).
      # El allowlist explícito PYSEC-2024-* documenta las vulns aceptadas;
      # cualquier hallazgo NUEVO fuera de ese allowlist hace fallar el build.
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-*
      # [SEC-09] npm audit — BLOQUEANTE
      - name: Permitir clonar dep pública @yachaydeep/brand por HTTPS (npm ci la pide por ssh)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: cd frontend && npm ci && npm audit --audit-level=high
