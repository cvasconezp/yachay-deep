# CI Pipeline — Yachay Deep
# REMEDIACIÓN:
#   [ARCH-01] Tests automatizados en CI
#   [ARCH-02] Linting automatizado
#   [SEC-09] Auditoría de dependencias

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linting ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/
      - run: ruff format --check backend/

  # ── Tests Backend ──
  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: pytest --tb=short -q
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "True"
          ADMIN_EMAIL: "ci@test.com"
          ADMIN_PASSWORD: "CiTestPass123!"

  # ── Auditoría de dependencias ──
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
      # [SEC-09] pip-audit
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-* || true
      # [SEC-09] npm audit
      - run: cd frontend && npm ci && npm audit --audit-level=high || true
