name: Daily AVAC Scraping + ETL

on:
  # Ejecutar todos los días a las 06:00 (hora Ecuador = UTC-5, entonces 11:00 UTC)
  schedule:
    - cron: "0 11 * * 1-5"  # Lunes a viernes a las 11:00 UTC (06:00 Ecuador)

  # Permitir ejecución manual desde GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué scraping ejecutar"
        required: true
        default: "full"
        type: choice
        options: [full, ingresos, tareas]

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Chrome para Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias Python
        run: |
          cd backend
          pip install -r requirements.txt
          pip install selenium==4.25.0 beautifulsoup4==4.12.3 requests==2.32.3

      - name: Crear directorios de datos
        run: |
          mkdir -p data/IngresosAVAC
          mkdir -p data/Tareas

      - name: Ejecutar scraping + ETL
        env:
          # Credenciales AVAC — configuradas en GitHub Secrets
          AVAC_USERNAME: ${{ secrets.AVAC_USERNAME }}
          AVAC_PASSWORD: ${{ secrets.AVAC_PASSWORD }}
          AVAC_BASE_URL: ${{ secrets.AVAC_BASE_URL || 'https://avac.ups.edu.ec/grado67' }}

          # Base de datos Railway
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Rutas de datos
          DATA_PATH_INGRESOS: ./data/IngresosAVAC
          DATA_PATH_TAREAS: ./data/Tareas
          DATA_PATH_CALIFICACIONES: ./data/calificaciones.csv

        run: |
          cd backend
          python -m scraping.runner --mode ${{ inputs.mode || 'full' }}

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping-logs-${{ github.run_number }}
          path: |
            data/IngresosAVAC/cursos_no_encontrados.csv
            data/IngresosAVAC/errores.log
          retention-days: 30

      - name: Notificar éxito
        if: success()
        run: |
          echo "✅ Scraping completado exitosamente"
          echo "Fecha: $(date)"

      - name: Notificar fallo
        if: failure()
        run: |
          echo "❌ El scraping falló. Revisa los logs en Actions."
          # Aquí puedes agregar notificación por email usando secrets.NOTIFICATION_EMAIL
